<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="House of Prayer Ministries">
  <defs>
    <linearGradient id="hop-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
    <linearGradient id="hop-cross" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Outer circle -->
  <circle cx="100" cy="100" r="96" fill="url(#hop-bg)" stroke="#d97706" stroke-width="3"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#d97706" stroke-width="1" opacity="0.6"/>

  <!-- Cross -->
  <g fill="url(#hop-cross)">
    <rect x="92" y="55" width="16" height="90" rx="2"/>
    <rect x="65" y="82" width="70" height="16" rx="2"/>
  </g>

  <!-- Rays around cross -->
  <g stroke="#f59e0b" stroke-width="1.5" stroke-linecap="round" opacity="0.7">
    <line x1="100" y1="38" x2="100" y2="48"/>
    <line x1="55" y1="60" x2="62" y2="68"/>
    <line x1="145" y1="60" x2="138" y2="68"/>
    <line x1="48" y1="100" x2="58" y2="100"/>
    <line x1="152" y1="100" x2="142" y2="100"/>
    <line x1="55" y1="140" x2="62" y2="132"/>
    <line x1="145" y1="140" x2="138" y2="132"/>
  </g>

  <!-- Text -->
  <text x="100" y="170" text-anchor="middle" font-family="Georgia, serif" font-size="11" font-weight="700" fill="#ffffff" letter-spacing="2">HOUSE OF PRAYER</text>
  <text x="100" y="184" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#d97706" letter-spacing="3">MINISTRIES</text>
</svg>
