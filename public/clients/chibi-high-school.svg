<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Chibi High School">
  <defs>
    <linearGradient id="chs-shield" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e40af"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="chs-ribbon" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Shield outline -->
  <path d="M100 18 L170 38 L170 110 Q170 160 100 184 Q30 160 30 110 L30 38 Z"
        fill="url(#chs-shield)" stroke="#d97706" stroke-width="3"/>
  <path d="M100 28 L160 46 L160 108 Q160 152 100 172 Q40 152 40 108 L40 46 Z"
        fill="none" stroke="#ffffff" stroke-width="1" opacity="0.5"/>

  <!-- Open book -->
  <g fill="#ffffff" stroke="#d97706" stroke-width="1.2">
    <path d="M65 78 Q80 72 100 76 Q120 72 135 78 L135 110 Q120 104 100 108 Q80 104 65 110 Z"/>
    <line x1="100" y1="76" x2="100" y2="108"/>
    <line x1="100" y1="100" x2="100" y2="100"/>
  </g>
  <!-- Book pages -->
  <g stroke="#d97706" stroke-width="0.6" opacity="0.6">
    <line x1="72" y1="86" x2="93" y2="84"/>
    <line x1="72" y1="92" x2="93" y2="90"/>
    <line x1="72" y1="98" x2="93" y2="96"/>
    <line x1="107" y1="84" x2="128" y2="86"/>
    <line x1="107" y1="90" x2="128" y2="92"/>
    <line x1="107" y1="96" x2="128" y2="98"/>
  </g>

  <!-- Graduation cap above book -->
  <g fill="#d97706">
    <polygon points="100,55 130,65 100,75 70,65"/>
    <polygon points="78,68 78,80 100,88 122,80 122,68 100,76"/>
    <line x1="128" y1="66" x2="128" y2="78" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="128" cy="80" r="2" fill="#d97706"/>
  </g>

  <!-- Banner ribbon at bottom -->
  <path d="M30 135 L170 135 L160 155 L40 155 Z" fill="url(#chs-ribbon)" stroke="#0c1929" stroke-width="1"/>

  <!-- Text -->
  <text x="100" y="150" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#ffffff" letter-spacing="1">CHIBI HIGH</text>
</svg>
